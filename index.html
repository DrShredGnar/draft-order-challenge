dsLeft <= 10 ? \"rgba(212,24,24,.75)\" : \"rgba(212,24,24,.35)\";\n        v.clockBorder = st.secondsLeft <= 10 ? \"var(--color-onair)\" : \"#3a1620\";\n        v.clockAnim = st.secondsLeft <= 5 ? \"lofgClock .5s steps(1,end) infinite\" : \"none\";\n        v.downLabel = [\"1st & 10\", \"2nd & 7\", \"3rd & 4\", \"4th & goal\"][st.qIndex % 4];\n        v.answeredLabel = Object.keys(row).length + \"/\" + st.players.length;\n        v.answerPips = st.players.map((p) => {\n          const done = !!row[p.id];\n          return { name: p.name, bg: done ? \"var(--color-accent-900)\" : \"transparent\", fg: done ? \"var(--color-accent-200)\" : \"color-mix(in srgb,var(--color-text) 38%,transparent)\", border: done ? \"var(--color-accent-700)\" : \"var(--color-line)\" };\n        });\n        const f = this.fastest();\n        v.fastestLabel = f ? `${f.name} \\u00b7 ${fmt(f.ms)}` : \"Nobody moved the ball.\";\n        const cor = st.players.filter((p) => row[p.id] && row[p.id].opt === q.correct);\n        v.correctCount = cor.length;\n        v.correctList = cor.sort((a, b) => row[a.id].ms - row[b.id].ms).map((p) => ({ label: `${p.name} \\u00b7 ${fmt(row[p.id].ms)}` }));\n        const wrong = st.players.filter((p) => row[p.id] && row[p.id].opt !== q.correct);\n        const noAns = st.players.filter((p) => !row[p.id]);\n        v.wrongList = wrong.sort((a, b) => row[a.id].ms - row[b.id].ms)\n          .map((p) => ({ label: `${p.name} \\u00b7 ${\"ABCD\"[row[p.id].opt]}` }))\n          .concat(noAns.map((p) => ({ label: `${p.name} \\u00b7 \\u2014` })));\n        v.wrongCount = wrong.length + noAns.length;\n        v.hasWrong = v.wrongCount > 0;\n        const nWrong = v.wrongCount, nAll = st.players.length;\n        const solo = nWrong === 1 ? (wrong[0] || noAns[0]) : null;\n        v.shameLine = nWrong === nAll\n          ? \"Nobody knew this. Embarrassing, all of you.\"\n          : solo\n            ? `Only ${solo.name} blew it. Everyone look.`\n            : nWrong === 1 ? \"One casualty.\" : `${nWrong} of you should be ashamed.`;\n        v.nextLabel = st.qIndex + 1 >= st.questions.length ? \"Reveal the draft order\" : `Next question (${st.qIndex + 2} of 12)`;\n      }\n      v.board = order.map((p, k) => ({\n        rank: k + 1, name: p.name, score: p.score, speed: (p.timeMs / 1000).toFixed(1) + \"s\",\n        rowBg: k === 0 ? \"color-mix(in srgb,var(--color-accent) 12%,transparent)\" : \"color-mix(in srgb, var(--color-text) 3%, transparent)\",\n        mark: k === 0 ? \"var(--color-accent)\" : \"transparent\",\n        scoreColor: k === 0 ? \"var(--color-accent-200)\" : \"var(--color-text)\"\n      }));\n      if (v.hReveal) {\n        const total = order.length;\n        const revealed = st.revealCount;\n        const firstShown = total - revealed + 1;\n        v.revealHeadline = revealed === 0 ? \"The board is set.\" : revealed >= total ? `${order[0] ? order[0].name : \"\\u2014\"} is on the clock.` : `Pick ${firstShown} is in.`;\n        v.draftRows = order.map((p, k) => {\n          const pick = k + 1, shown = pick >= firstShown;\n          const onClock = !shown && pick === firstShown - 1 && revealed < total;\n          const first = shown && pick === 1;\n          return {\n            pick: \"Pick \" + pick, pickNum: String(pick).padStart(2, \"0\"), round: pick <= 6 ? \"Round 1 \\u00b7 early\" : \"Round 1 \\u00b7 late\", name: shown ? p.name : onClock ? \"ON THE CLOCK\" : \"\",\n            detail: shown ? `${pts(p.score)} \\u00b7 ${(p.timeMs / 1000).toFixed(1)}s` : \"\",\n            bg: first ? \"color-mix(in srgb,var(--color-accent) 18%,transparent)\" : shown ? \"var(--color-surface)\" : onClock ? \"color-mix(in srgb,var(--color-onair) 12%,transparent)\" : \"color-mix(in srgb, var(--color-text) 2%, transparent)\",\n            border: first ? \"var(--color-accent)\" : shown ? \"var(--color-line)\" : onClock ? \"var(--color-onair)\" : \"#161c2b\",\n            opacity: shown ? 1 : onClock ? 0.85 : 0.3,\n            anim: shown ? \"lofgSlam .5s ease-out\" : onClock ? \"lofgPulse 1.4s ease-in-out infinite\" : \"none\",\n            pickColor: first ? \"var(--color-accent-200)\" : \"color-mix(in srgb,var(--color-text) 45%,transparent)\",\n            nameColor: shown ? \"var(--color-text)\" : \"var(--onair-ink)\"\n          };\n        });\n        v.revealFoot = revealed >= total ? \"Ties broken by cumulative time on correct answers. Copy the order or download the card.\" : \"One pick every few seconds, worst to first.\";\n        v.copyShare = this.copyShare; v.downloadCard = this.downloadCard;\n        v.copyLabel = st.copied ? \"Copied\" : \"Copy draft order\";\n        // A no-op once the order is moving, so a click on Copy or Download at\n        // the end cannot be swallowed by the board's own handler.\n        v.skipRevealHold = this.skipRevealHold;\n      }\n      return v;\n    }\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
