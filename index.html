  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>League of Ordinary Gentlemen — Draft Order Challenge<\u002Ftitle>\n<meta name=\"description\" content=\"Twelve questions of football trivia decide the draft order. Winner takes first pick.\">\n<meta name=\"theme-color\" content=\"#161826\">\n<meta property=\"og:title\" content=\"League of Ordinary Gentlemen — Draft Order Challenge\">\n<meta property=\"og:description\" content=\"Twelve questions of football trivia decide the draft order. Winner takes first pick.\">\n<script src=\"4882ea57-300d-4157-9920-b486a1b0d129\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Nocturne — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n/* ── Draft Night Broadcast typefaces ───────────────────────────────────────\n   Barlow Condensed is the chyron letterform (display, eyebrows, big numerals);\n   JetBrains Mono is everything read under the clock (body, tables, scores).\n   Latin subsets only — this is an English-language football game, and the\n   bundle has to stay small enough to open over a phone hotspot on draft night.\n   No unicode-range: these are the only faces declared for each family, so the\n   browser uses them for every character and falls back per-glyph if needed. */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000001\") format('woff2');\n}\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000002\") format('woff2');\n}\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000003\") format('woff2');\n}\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: italic;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000004\") format('woff2');\n}\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: italic;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000005\") format('woff2');\n}\n/* One variable file covers the whole 400-700 range the tables use. */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"a1000000-0000-4000-8000-000000000006\") format('woff2');\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Barlow Condensed\", \"Arial Narrow\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"JetBrains Mono\", ui-monospace, monospace;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-line); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"8dd7a116-12ca-4e2c-a1ad-4555d932be01\"><\u002Fscript>\n<script src=\"d2d97104-fefd-4fe3-b506-701516a3327e\"><\u002Fscript>\n<script src=\"df85a145-0bd5-4e8c-980e-7d50b3ae3e53\"><\u002Fscript>\n<style>\n/* ══════════════════════════════════════════════════════════════════════════\n   DRAFT NIGHT BROADCAST — the league's design system, applied to the game.\n   Source of truth: DESIGN.md in the war-room repo. This block overrides the\n   generic Nocturne tokens above so the game reads as the same broadcast as\n   /draft, /recap and /slots rather than as a separate product.\n\n   The one colour rule everything else follows:\n     RED  = live. The play clock, the ON AIR dot, the kickoff button. Nothing\n            that is not happening right now is allowed to be red.\n     GREEN = the field. Points scored, answers correct, players checked in.\n     YELLOW = the flag. A blown call is a penalty flag, and a penalty flag is\n            yellow — which is both what a real one looks like and what keeps\n            red meaning \"live\" and nothing else.\n   ══════════════════════════════════════════════════════════════════════ */\n:root{\n  /* — surfaces (DESIGN.md: stadium at night) — */\n  --color-bg:#0a0c14;\n  --color-surface:#131926;\n  --color-panel2:#192234;\n  --color-line:#1e2d44;\n  --color-divider:#1e2d44;\n\n  /* — ink — */\n  --color-text:#f0ecdf;\n  --color-muted:#8898b8;\n\n  /* — accent = field green. Points, correct answers, presence. — */\n  --color-accent:#2fa862;\n  --color-accent-100:#f1fdf5;\n  --color-accent-200:#cdf2dc;\n  --color-accent-300:#9ce3b8;\n  --color-accent-400:#66cf92;\n  --color-accent-500:#3fb975;\n  --color-accent-600:#2b9a5c;\n  --color-accent-700:#1f7a48;\n  --color-accent-800:#175c37;\n  --color-accent-900:#103f26;\n\n  /* — ON AIR red. Borders and fills take the base token; red TEXT takes\n       --onair-ink, because #d41818 fails AA against these panels. — */\n  --color-onair:#d41818;\n  --onair-ink:#ff5a5a;\n  --onair-deep:#2a0708;\n\n  /* — the flag — */\n  --color-penalty:#ffcf6b;\n  --color-penalty-bright:#ffe0a0;\n  --color-penalty-deep:#2e2000;\n\n  /* — tier colours, from DESIGN.md's position palette. Four genuinely\n       different hues on a difficulty ramp; the old four were four shades of\n       the same green and read as one. — */\n  --tier-easy:#7ec028;    /* RB  */\n  --tier-medium:#e8c820;  /* WR  */\n  --tier-hard:#c86020;    /* TE  */\n  --tier-brutal:#e84530;  /* QB  */\n\n  /* — typography — */\n  --font-heading:\"Barlow Condensed\", \"Arial Narrow\", system-ui, sans-serif;\n  --font-body:\"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace;\n\n  /* — broadcast graphics have corners, not bubbles (DESIGN.md) — */\n  --radius-sm:2px;\n  --radius-md:3px;\n  --radius-lg:4px;\n\n  --shadow-sm:0 0 0 1px var(--color-line);\n  --shadow-md:0 0 0 1px var(--color-line), 0 6px 18px rgba(0,0,0,.55);\n  --shadow-lg:0 0 0 1px #2b3d59, 0 16px 40px rgba(0,0,0,.7);\n}\n\n/* Condensed caps are the house voice for anything that would be shouted by a\n   graphics operator: hero names, page titles, big numerals. Barlow Condensed\n   is narrow, so DESIGN.md sizes it UP relative to the old Inter values — the\n   markup below carries those adjusted sizes. */\nh1,h2,h3,h4,h5,h6{\n  font-family:var(--font-heading);\n  font-weight:800;\n  text-transform:uppercase;\n  letter-spacing:.005em;\n  line-height:.94;\n}\n\n/* The lower-third slant: italic condensed caps, tracked out, over a rule of\n   1px line + hash ticks. Used for every eyebrow and section header. */\n.chyron-eyebrow{\n  display:flex;align-items:center;gap:10px;\n  font-family:var(--font-heading);font-style:italic;font-weight:700;\n  text-transform:uppercase;letter-spacing:.12em;line-height:1;\n  color:var(--color-muted);\n}\n.chyron-eyebrow::after{\n  content:\"\";flex:1;height:3px;min-width:24px;\n  background:\n    linear-gradient(var(--color-line),var(--color-line)) no-repeat 0 0/100% 1px,\n    repeating-linear-gradient(90deg,var(--color-line) 0 1px,transparent 1px 14px)\n      no-repeat 0 100%/100% 3px;\n}\n\n/* ON AIR badge — red block, pulsing white dot. The only thing on the page\n   allowed to animate near the decision zone. */\n.onair{\n  display:inline-flex;align-items:center;gap:8px;\n  padding:6px 11px;border-radius:3px;background:var(--color-onair);\n  box-shadow:0 0 18px rgba(212,24,24,.45);\n  font-family:var(--font-heading);font-style:italic;font-weight:700;\n  text-transform:uppercase;letter-spacing:.16em;line-height:1;color:#fff;\n  white-space:nowrap;\n}\n.onair-dot{\n  flex:none;width:7px;height:7px;border-radius:50%;background:#fff;\n  animation:lofgPulse 1.6s ease-in-out infinite;\n}\n\n/* Numbers are read across a room and must not reflow column to column. */\n.tnum{font-variant-numeric:tabular-nums}\n@keyframes lofgPulse{0%,100%{opacity:1}50%{opacity:.3}}\n@keyframes lofgSlam{0%{opacity:0;transform:scale(1.3)}60%{opacity:1;transform:scale(.98)}100%{transform:scale(1)}}\n@keyframes lofgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes lofgBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-3px) rotate(-2deg)}}\n@keyframes lofgLegs{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}\n@keyframes lofgClock{0%,100%{opacity:1}50%{opacity:.55}}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   THE COLD OPEN — kickoff sequence, host screen only.\n   DESIGN.md caps motion at one signature because the war room is a 60-second\n   decision surface. This is the exception the doc now carves out: a broadcast\n   opens huge and then calms down for play. Nothing here runs once a question\n   is on screen.\n   The whole sequence is driven by animation-delay, not by a JS timeline, so\n   the beats cannot drift from each other and the overlay mounts exactly once.\n   ══════════════════════════════════════════════════════════════════════ */\n@keyframes lofgFloodIn{from{opacity:0;transform:translateY(-40px) scaleY(.6)}to{opacity:1;transform:none}}\n@keyframes lofgYardSweep{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}\n/* Names arrive like a graphics operator punching them in: overshoot, settle. */\n@keyframes lofgNameSlam{0%{opacity:0;transform:scale(1.45) translateY(8px)}55%{opacity:1;transform:scale(.965)}100%{opacity:1;transform:scale(1)}}\n@keyframes lofgRosterOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:scale(1.12);filter:blur(6px)}}\n@keyframes lofgTitleSlam{0%{opacity:0;transform:scale(1.8);letter-spacing:.14em}60%{opacity:1;transform:scale(.97);letter-spacing:.005em}100%{opacity:1;transform:scale(1)}}\n@keyframes lofgTabDrop{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n@keyframes lofgStakesIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}\n/* ── THE WIPE THAT HANDS OFF TO DRIVE 1 ───────────────────────────────────\n   Two angled panels, not one flat slab. A broadcast wipe is raked and it\n   carries a highlight; a perpendicular rectangle of solid colour reads as a\n   CSS transition, which is what this was.\n   The panels are oversized (top/bottom -12%, left/right -25%) because a\n   skewed rectangle no longer covers the corners at translateX(0) — and full\n   coverage at that instant is load-bearing, not cosmetic: the phase change\n   to drive 1 happens underneath it. Skew of 17deg over a 16:9 viewport\n   displaces about 12vw; the 25vw of slack on each side absorbs it.\n   Travel is +/-90% of the element's own (150vw) width, which is past the\n   viewport on both sides. */\n@keyframes lofgWipe{0%{transform:translateX(-90%) skewX(-12deg)}55%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(90%) skewX(-12deg)}}\n/* The navy panel runs 120ms ahead at a steeper rake, so the two edges\n   converge into a wedge instead of arriving as one wall. Depth only —\n   nothing is timed against it and it may drop out with no consequence. */\n@keyframes lofgWipeLead{0%{transform:translateX(-90%) skewX(-17deg)}55%{transform:translateX(0) skewX(-17deg)}100%{transform:translateX(90%) skewX(-17deg)}}\n/* The kickoff plate rises under the floodlight beat and is gone by the time\n   the title slams, handing the screen back to the typography. */\n@keyframes lofgPlateIn{from{opacity:0}to{opacity:.85}}\n@keyframes lofgPlateOut{from{opacity:.85}to{opacity:0}}\n/* The league ident — the network card a broadcast opens on, before anything\n   about tonight's game. Leaves with the roster. */\n@keyframes lofgIdentIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}\n@keyframes lofgIdentOut{from{opacity:1}to{opacity:0}}\n/* The defending-champion lower-third: slides in off the left like a graphics\n   operator punching up a chyron, overshoots a hair, settles. */\n@keyframes lofgChampIn{0%{opacity:0;transform:translateX(-34px)}60%{opacity:1;transform:translateX(3px)}100%{opacity:1;transform:none}}\n\n.lofg-intro{\n  position:fixed;inset:0;z-index:60;overflow:hidden;cursor:pointer;\n  display:grid;align-content:center;justify-items:start;\n  padding:clamp(28px,5vw,90px);\n  background:var(--color-bg);\n}\n/* ── THE KICKOFF PLATE ─────────────────────────────────────────────────────\n   A lit-stadium clip under the first half of the cold open. Three properties\n   make it safe to add to a sequence that is otherwise tuned to the frame:\n\n   1. It is decoration with a hard floor. The sequence's own background is\n      already navy, and nothing in it is positioned or timed against the\n      plate, so a file that 404s, stalls on a hotspot, or is refused by an\n      autoplay policy leaves the cold open exactly as it shipped without it.\n   2. It is not in the bundle. ~2.3MB against a 465KB page that has to open\n      over a phone hotspot, and only the host screen ever renders it — so it\n      is a sibling file the eleven phones never request, warmed during the\n      lobby so kickoff is not waiting on the network.\n   3. It is silent as a file, not by attribute. The audio track is stripped\n      out of the mp4 itself; `muted` here is belt-and-braces for autoplay,\n      not the thing keeping DESIGN.md's silence rule.\n\n   Measured before shipping: across the clip, the band where the intro's type\n   sits peaks at relative luminance .061, so #f0ecdf holds 7.95:1 even at full\n   opacity — comfortably past AAA. The .85 below is taste, not the guardrail. */\n.lofg-intro-plate{\n  position:absolute;inset:0;width:100%;height:100%;\n  object-fit:cover;\n  /* Crop the lower edge of the source: it carries a faintly green field and\n     yellow uprights, and DESIGN.md keeps turf out of the system and holds\n     yellow for a penalty flag. */\n  object-position:50% 32%;\n  pointer-events:none;  /* click-to-skip belongs to .lofg-intro */\n  z-index:0;            /* first in DOM and level 0: everything else paints over it */\n  opacity:0;\n  animation:lofgPlateIn .9s ease-out both, lofgPlateOut .8s ease-in 4.2s both;\n}\n/* ── AMBIENT PLATE ─────────────────────────────────────────────────────────\n   The same clip, reused as a backdrop on the two screens the room actually\n   stares at: the home chooser and the lobby while people trickle in. It is\n   free. The host already downloads this file during the lobby to warm the\n   cache for the cold open, so this shows those bytes instead of hiding them\n   in a 1x1 preloader — and being visible, it is not subject to whatever\n   deprioritisation a hidden media element gets.\n\n   Same carve-out as the cold open: nothing is being decided on these screens\n   and no clock is running, so \"nothing animates near the decision zone\" does\n   not apply. It is furniture, not a signature.\n\n   Deliberately NOT looped. A 5s clip on repeat cuts hard back to darkness\n   every five seconds and the seam is the only thing you would notice. Played\n   once it holds on its final frame, so the floodlights come up as the room\n   fills and then stay lit, which is what a stadium does.\n\n   Host-side only — see showAmbient. The eleven phones never render it, and\n   therefore never spend 2.3MB of hotspot on it. */\n.lofg-ambient{\n  position:fixed;inset:0;width:100%;height:100%;\n  object-fit:cover;object-position:50% 30%;\n  z-index:-1;              /* above the wrapper's floodlight+yard-line paint,\n                              below every scrap of content */\n  pointer-events:none;opacity:.30;\n  /* Masked to the top, not scrimmed. The clip's light towers live in the\n     upper frame and every screen using this puts its type lower down, so the\n     video is simply gone before it reaches the room code, the QR or the\n     roster. A mask removes it; a dark scrim would only dim what is already\n     near-black and muddy the towers on the way. */\n  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.55) 38%,transparent 66%);\n  mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.55) 38%,transparent 66%);\n}\n\n/* ── LEAGUE IDENT ──────────────────────────────────────────────────────────\n   Top-left, over the floodlight and the roster call: who this is, and what\n   season it is. Broadcast order — the league before the show. It leaves on\n   the same beat as the roster so the title slam lands on a clear frame. */\n.lofg-intro-ident{\n  position:absolute;top:clamp(28px,5vw,90px);left:clamp(28px,5vw,90px);right:clamp(28px,5vw,90px);\n  /* Deliberately no z-index. It already paints above the plate by DOM order,\n     and a positive z-index would lift it ABOVE the wipe panels — which are\n     z-index:auto — so the ident would survive the wipe that is supposed to\n     cover the whole screen at the cut. Today that is masked by the ident\n     being opacity:0 long before the wipe runs, but the cut seam must not\n     depend on an unrelated fade-out. */\n  display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);\n  animation:lofgIdentIn .7s ease-out .55s both, lofgIdentOut .4s ease-in 3.85s both;\n}\n.lofg-intro-league,.lofg-intro-season{\n  font-family:var(--font-heading);font-style:italic;font-weight:700;\n  text-transform:uppercase;letter-spacing:.16em;white-space:nowrap;\n}\n.lofg-intro-league{font-size:clamp(12px,1.25vw,21px);color:var(--color-text)}\n.lofg-intro-season{font-size:clamp(11px,1.05vw,18px);color:var(--color-muted)}\n/* DESIGN.md: an eyebrow pairs with a yard-line rule — 1px line + hash ticks. */\n.lofg-intro-ident-rule{\n  flex:1;min-width:24px;height:7px;\n  background:\n    linear-gradient(var(--color-line),var(--color-line)) left center/100% 1px no-repeat,\n    repeating-linear-gradient(90deg,var(--color-line) 0 1px,transparent 1px 14px);\n}\n@media (max-width:620px){ .lofg-intro-season,.lofg-intro-ident-rule{display:none} }\n\n/* ── DEFENDING CHAMPION ────────────────────────────────────────────────────\n   The chyron hero from DESIGN.md — position-color tab on the left edge,\n   italic condensed eyebrow, condensed 800 caps name.\n   Green, not gold. In this system yellow is the penalty flag and red is\n   live-only, so the obvious \"champion = gold\" would read as a blown call.\n   Green is the field: points scored, and a title is the most scored thing\n   there is. */\n.lofg-intro-champ{\n  position:relative;padding-left:22px;\n  display:flex;flex-direction:column;gap:clamp(3px,.7vh,9px);\n  animation:lofgChampIn .5s cubic-bezier(.16,1,.3,1) 10.9s both;\n}\n.lofg-intro-champ span.tab{\n  position:absolute;left:0;top:0;bottom:0;width:12px;\n  background:var(--color-accent);transform-origin:top;\n  animation:lofgTabDrop .3s ease-out 11.05s both;\n}\n.lofg-intro-champ-eyebrow{\n  font-family:var(--font-heading);font-style:italic;font-weight:700;\n  text-transform:uppercase;letter-spacing:.18em;\n  font-size:clamp(12px,1.35vw,23px);color:var(--color-accent-300);\n}\n.lofg-intro-champ-name{\n  font-family:var(--font-heading);font-weight:800;text-transform:uppercase;\n  font-size:clamp(28px,4.2vw,72px);line-height:.92;letter-spacing:.01em;\n  color:var(--color-text);\n}\n.lofg-intro-roster,.lofg-intro-card{grid-area:1/1;align-self:center}\n.lofg-intro-card{\n  display:flex;flex-direction:column;align-items:flex-start;\n  gap:clamp(12px,2.2vh,28px);width:100%;\n}\n.lofg-intro-flood{\n  position:absolute;left:50%;top:-140px;width:min(1400px,150vw);height:520px;\n  transform:translateX(-50%);pointer-events:none;\n  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(136,168,232,.16), transparent 70%);\n  animation:lofgFloodIn 1.1s ease-out both;\n}\n.lofg-intro-yard{\n  position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;transform-origin:left center;\n  background-image:repeating-linear-gradient(90deg,transparent 0,transparent 119px,color-mix(in srgb,var(--color-line) 70%,transparent) 119px,color-mix(in srgb,var(--color-line) 70%,transparent) 120px);\n  animation:lofgYardSweep .9s ease-out .15s both;\n}\n.lofg-intro-roster{\n  /* Names run left-to-right then wrap, so the slam order matches reading\n     order. A single 22ch column left most of a TV empty. */\n  position:relative;display:grid;grid-template-columns:repeat(3,max-content);\n  gap:clamp(2px,.6vh,12px) clamp(28px,4vw,86px);\n  justify-content:start;max-width:100%;\n  animation:lofgRosterOut .4s ease-in 3.85s both;\n}\n@media (max-width:760px){ .lofg-intro-roster{grid-template-columns:repeat(2,minmax(0,1fr))} }\n.lofg-intro-name{\n  font-family:var(--font-heading);font-weight:800;text-transform:uppercase;\n  font-size:clamp(30px,4.7vw,86px);line-height:.94;letter-spacing:.01em;\n  color:var(--color-text);\n}\n.lofg-intro-title{position:relative;padding-left:26px;opacity:0;animation:lofgTitleSlam .5s cubic-bezier(.16,1,.3,1) 4s both}\n.lofg-intro-title span.tab{position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--color-onair);transform-origin:top;animation:lofgTabDrop .3s ease-out 4.15s both}\n.lofg-intro-title h1{font-size:clamp(46px,9vw,150px);margin:0;line-height:.9;box-shadow:0 -3px 0 0 var(--color-onair) inset}\n.lofg-intro-stakes,.lofg-intro-stakes2{\n  font-family:var(--font-heading);font-style:italic;font-weight:700;text-transform:uppercase;\n  letter-spacing:.16em;color:var(--color-accent-300);\n}\n/* Two stakes beats, one per line of the voice-over: \"twelve questions\n   decide the draft order\" lands at 6.0s, \"winner takes first pick\" at\n   8.9s. Split so the screen moves when the read moves, rather than one\n   long line sitting still for three seconds. */\n.lofg-intro-stakes{\n  font-size:clamp(15px,2vw,34px);\n  animation:lofgStakesIn .45s cubic-bezier(.16,1,.3,1) 6s both;\n}\n.lofg-intro-stakes2{\n  font-size:clamp(14px,1.75vw,30px);color:var(--color-text);\n  animation:lofgStakesIn .45s cubic-bezier(.16,1,.3,1) 8.9s both;\n}\n/* The navy leading panel. Behind the red one and 120ms early, so its rake\n   shows ahead of the red edge. */\n.lofg-intro-wipe-lead{\n  position:absolute;top:-12%;bottom:-12%;left:-25%;right:-25%;\n  background:var(--color-surface);pointer-events:none;\n  animation:lofgWipeLead 1.05s cubic-bezier(.7,0,.3,1) 13.55s both;\n}\n/* The red panel is the one that guarantees coverage. INTRO_MS is keyed to\n   THIS animation — its delay and duration, and the keyframe stop where it\n   reaches translateX(0). A test derives that arithmetic from this rule, so\n   retiming here without moving INTRO_MS fails the build. */\n.lofg-intro-wipe{\n  position:absolute;top:-12%;bottom:-12%;left:-25%;right:-25%;\n  background:var(--color-onair);pointer-events:none;\n  /* Yard lines ride across on the red, so what sweeps the screen is the\n     field rather than a rectangle of paint. */\n  background-image:repeating-linear-gradient(90deg,\n    rgba(255,255,255,.11) 0 1px, transparent 1px 120px);\n  animation:lofgWipe 1.05s cubic-bezier(.7,0,.3,1) 13.6s both;\n}\n/* Hot leading edge with the ON AIR glow — a broadcast wipe carries a\n   highlight rather than a hard colour boundary. */\n.lofg-intro-wipe::after{\n  content:\"\";position:absolute;top:0;bottom:0;right:-2px;width:5px;\n  background:var(--color-text);\n  box-shadow:0 0 26px 6px rgba(212,24,24,.85), 0 0 64px 14px rgba(212,24,24,.42);\n}\n\n/* Reduced motion: the sequence collapses to a static card. The kickoff timer\n   in beginGame() shortens to match, so the game does not sit waiting on\n   animations that are not running. This block also stops the ON AIR pulse --\n   \"reduce\" means reduce, signature or not. */\n/* ── THE HOST SCREEN ON A SMALL SCREEN ─────────────────────────────────────\n   The host view is built for a television: one viewport tall, nothing\n   scrolls, two columns side by side. Opened on a phone it did not shrink, it\n   CLIPPED — `overflow:hidden` on a layout wider than the screen swallowed the\n   play clock, the whole roster column, and two of the four answer cards.\n   Nothing scrolled, so there was no way to reach them; the content simply was\n   not there. Verified on an iPhone 16 Pro viewport (402px): the lobby's right\n   column ran to x=542 and answer cards B and D to x=517.\n\n   Two separate causes, both fixed above: an explicit `minmax(320px,…)` floor\n   on the lobby, and — less obvious — plain `1fr` tracks on the answer grid.\n   A grid item's automatic minimum is its MIN-CONTENT width, so a single long\n   unbreakable answer (the league-history questions answer with usernames like\n   \"zachwest88\") widened the track past its share. `minmax(0,1fr)` is what\n   actually lets a track shrink.\n\n   Below 760px the whole thing becomes one column that scrolls. This is a\n   fallback, not a second design — the TV is still the intended surface, and\n   the phones have their own player view. It exists so that a commissioner who\n   opens the host screen on a handset sees a usable game rather than a broken\n   one. */\n@media (max-width:760px){\n  /* !important is load-bearing here, not decoration. The wrapper carries\n     `height:var(--app-h);overflow:hidden` as an INLINE style, and an inline\n     declaration beats a stylesheet rule regardless of selector specificity —\n     so the first version of this block was silently ignored in full. The\n     container stayed exactly one viewport tall with overflow hidden, which\n     rendered ~590px of lobby that no gesture could reach: the roster count\n     was cut mid-glyph and nothing scrolled. */\n  .lofg-host{\n    height:auto !important;\n    min-height:var(--app-h);\n    overflow:visible !important;\n    -webkit-overflow-scrolling:touch;\n  }\n  /* Every host layout collapses to a single column.\n     `overflow:visible` and `flex:none` matter as much as the column count:\n     each of these panes was sized to share one TV viewport (`flex:1`,\n     `min-height:0`, `overflow:hidden`) and would otherwise keep clipping\n     vertically in a scrolling column — the first fix stopped the roster\n     running off the RIGHT edge and left it running off the BOTTOM. */\n  .lofg-host-lobby,.lofg-host-answers,.lofg-host-reveal{\n    grid-template-columns:minmax(0,1fr) !important;\n    align-items:start !important;\n    overflow:visible !important;\n    min-height:auto !important;\n    flex:none !important;\n  }\n  /* The four answer cards stop being a 2x2 and become a stack, so each one\n     gets the full width its text needs. */\n  /* The status row (tier + drive | cards in + play clock) had no flex-wrap,\n     so on a phone the play clock ran 53px off the right edge and `0:28` read\n     as `0:2` with \"PLAY CLO\" chopped — exactly what the iPhone screenshots\n     showed. It wraps now, and the clock group spans the new line rather than\n     hanging off one side. */\n  .lofg-host-statusrow{ gap:10px !important; }\n  .lofg-host-clockgroup{ width:100%; justify-content:flex-start; }\n  .lofg-host-answers{ grid-template-rows:none !important; }\n  .lofg-host-answers > *{ min-height:76px; }\n  .lofg-host-lobby > *,.lofg-host-reveal > *{\n    overflow:visible !important; min-height:auto !important;\n  }\n}\n\n@media (prefers-reduced-motion: reduce){\n  .lofg-intro,.lofg-intro *{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important}\n  .lofg-intro{animation:none !important}\n  /* The plate is motion by definition — a moving camera cannot be collapsed\n     to a static frame the way an animation can, so it does not render at all. */\n  .lofg-intro-roster,.lofg-intro-wipe,.lofg-intro-wipe-lead,.lofg-intro-plate,.lofg-ambient{display:none}\n  .lofg-intro-title,.lofg-intro-stakes,.lofg-intro-stakes2,.lofg-intro-ident,.lofg-intro-champ{opacity:1 !important;transform:none !important}\n  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}\n}\n:root{--app-h:100vh}\n@supports (height:100dvh){:root{--app-h:100dvh}}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}\nbutton{-webkit-tap-highlight-color:transparent;touch-action:manipulation}\ninput{-webkit-tap-highlight-color:transparent}\na{color:var(--color-accent)}a:hover{color:var(--color-accent-400)}\nbutton{font-family:inherit}\n:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}\n::selection{background:color-mix(in srgb,var(--color-accent) 35%,transparent)}\n/* Mono body text runs wide; pull the tracking in slightly so paragraphs at\n   13-14px still hold a comfortable measure on a phone. */\np{letter-spacing:.005em}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative;z-index:0;min-height:var(--app-h);background-color:var(--color-bg);background-image:radial-gradient(ellipse 900px 380px at 50% -80px, rgba(136,168,232,.07), transparent 70%),repeating-linear-gradient(90deg,transparent 0,transparent 119px,color-mix(in srgb, var(--color-line) 55%, transparent) 119px,color-mix(in srgb, var(--color-line) 55%, transparent) 120px)\">\n\n<!-- Mounted outside the per-screen blocks on purpose: the host goes home ->\n     lobby, and a per-screen copy would unmount and refetch 2.3MB and restart\n     the ignition from black. One element spans both. -->\n<sc-if value=\"{{ showAmbient }}\" hint-placeholder-val=\"{{ false }}\">\n<video class=\"lofg-ambient\" src=\"kickoff-plate.mp4\" autoplay muted playsinline preload=\"auto\" aria-hidden=\"true\" tabindex=\"-1\"><\u002Fvideo>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"max-width:1060px;margin:0 auto;padding:max(44px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-left)) 52px;display:flex;flex-direction:column;gap:clamp(24px,5vw,38px);box-sizing:border-box\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"chyron-eyebrow\" style=\"font-size:14px\">League of Ordinary Gentlemen · Draft Day<\u002Fdiv>\n    <!-- Chyron hero: red position tab on the left edge, condensed 800 caps\n         name, red inset baseline. Same lower-third construction as the war\n         room's recommendation panel. -->\n    <div style=\"position:relative;padding-left:22px;margin:2px 0 4px\">\n      <span style=\"position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--color-onair)\"><\u002Fspan>\n      <h1 style=\"font-size:clamp(46px,11.5vw,104px);margin:0;max-width:14ch\">Draft Order Challenge<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:1px;border-radius:var(--radius-md);border:1px solid var(--color-line);background:var(--color-bg);margin:6px 0 2px;overflow:hidden\">\n      <span class=\"onair\" style=\"flex:none;border-radius:0;font-size:13px;padding:11px 15px;box-shadow:none\">\n        <span class=\"onair-dot\"><\u002Fspan>On the clock\n      <\u002Fspan>\n      <span style=\"flex:none;display:flex;align-items:center;padding:10px 14px;font-family:var(--font-heading);font-style:italic;font-weight:700;font-size:14px;line-height:1;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:var(--color-muted)\">12 picks<\u002Fspan>\n      <span style=\"flex:1 1 20ch;min-width:0;display:flex;align-items:center;padding:10px 14px;font-size:12.5px;line-height:1.45;text-wrap:pretty;color:var(--color-muted)\">Decided on the field, not by a random number generator.<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;line-height:1.6;max-width:62ch;color:var(--color-muted);margin:0;text-wrap:pretty\">Twelve questions, four tiers, thirty seconds each. Every question is drawn at random from a sealed pool at kickoff — the commissioner plays as blind as everyone else. The final scoreboard becomes the draft board — twelve questions decide the draft order, and the winner takes first pick.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n    <button sc-camel-on-click=\"{{ goHost }}\" style=\"text-align:left;cursor:pointer;background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-lg);padding:26px 24px;color:var(--color-text);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-md)\" style-hover=\"border-color:var(--color-accent-600);background:color-mix(in srgb, var(--color-accent) 10%, var(--color-surface))\">\n      <span style=\"font:italic 700 13px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-400)\">Host<\u002Fspan>\n      <span style=\"font-family:var(--font-heading);font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95\">TV screen<\u002Fspan>\n      <span style=\"font-size:12.5px;line-height:1.45;color:var(--color-muted)\">Display only. Nobody's answers appear here.<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goJoin }}\" style=\"text-align:left;cursor:pointer;background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-lg);padding:26px 24px;color:var(--color-text);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-md)\" style-hover=\"border-color:var(--color-accent-600);background:color-mix(in srgb, var(--color-accent) 10%, var(--color-surface))\">\n      <span style=\"font:italic 700 13px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-400)\">Player<\u002Fspan>\n      <span style=\"font-family:var(--font-heading);font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95\">Join on phone<\u002Fspan>\n      <span style=\"font-size:12.5px;line-height:1.45;color:var(--color-muted)\">Four-letter room code and your name.<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goPool }}\" style=\"text-align:left;cursor:pointer;background:transparent;border:1px solid var(--color-line);border-radius:var(--radius-lg);padding:26px 24px;color:var(--color-text);display:flex;flex-direction:column;gap:8px\" style-hover=\"border-color:var(--color-accent-600);background:color-mix(in srgb, var(--color-accent) 7%, transparent)\">\n      <span style=\"font:italic 700 13px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-400)\">Sealed pool<\u002Fspan>\n      <span style=\"font-family:var(--font-heading);font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95\">Pool integrity<\u002Fspan>\n      <span style=\"font-size:12.5px;line-height:1.45;color:var(--color-muted)\">Counts and rules only. No answers shown.<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 42%,transparent);border-top:1px solid var(--color-divider);padding-top:16px\">Realtime: {{ rtLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPool }}\">\n<div style=\"max-width:820px;margin:0 auto;padding:56px 32px 80px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <div>\n      <div style=\"font:italic 700 14px/1 var(--font-heading);letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-400);margin-bottom:10px\">Sealed pool<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:34px;letter-spacing:.005em\">Nobody sees these first.<\u002Fh2>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goHome }}\" class=\"btn btn-primary\" style=\"cursor:pointer\">Back<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"margin:0;max-width:58ch;font-size:15px;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty\">At kickoff the app draws three questions per tier at random and shuffles the four options on each. One of every three comes from this league's own history — the 2024 and 2025 drafts, both title games, every weekly score. The draw happens on the host device the moment the game starts, so the commissioner is playing the same unseen set as the other eleven.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px\">\n    <sc-for list=\"{{ poolRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <div style=\"background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font:italic 700 14px/1 var(--font-heading);letter-spacing:.16em;text-transform:uppercase;color:{{ t.fg }}\">{{ t.label }}<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-size:49px;font-weight:800;letter-spacing:.005em;font-variant-numeric:tabular-nums\">{{ t.count }}<\u002Fspan>\n        <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">in pool · {{ t.house }} from league history · 3 drawn · {{ t.points }}pt each<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isJoin }}\">\n<div style=\"min-height:var(--app-h);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-left)) max(28px,env(safe-area-inset-bottom));max-width:440px;margin:0 auto;box-sizing:border-box\">\n  <div>\n    <div style=\"font:italic 700 14px/1 var(--font-heading);letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-400);margin-bottom:10px\">League of Ordinary Gentlemen<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:38px;letter-spacing:.005em\">Get in the draft.<\u002Fh2>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasQuick }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--radius-md);background:color-mix(in srgb,var(--color-accent) 10%,transparent);border:1px solid var(--color-accent-700)\">\n    <span style=\"font:italic 700 14px/1 var(--font-heading);letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-300)\">{{ quickKicker }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ quickJoin }}\" style=\"cursor:pointer;min-height:64px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:color-mix(in srgb,var(--color-accent) 18%,transparent);color:var(--color-accent-100);font-family:var(--font-heading);font-size:29px;font-weight:800;transition:transform .08s ease\" style-active=\"transform:scale(.985)\">{{ quickLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <label style=\"font:italic 700 15px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Room code<\u002Flabel>\n    <input value=\"{{ joinCode }}\" sc-camel-on-change=\"{{ onJoinCode }}\" sc-camel-max-length=\"4\" placeholder=\"ABCD\" sc-camel-auto-capitalize=\"characters\" sc-camel-auto-correct=\"off\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" sc-camel-input-mode=\"text\" sc-camel-enter-key-hint=\"next\" style=\"font-family:var(--font-heading);font-size:55px;font-weight:800;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:16px;border-radius:var(--radius-md);border:1px solid #2b3d59;background:var(--color-surface);color:var(--color-text)\">\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <label style=\"font:italic 700 15px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Your name<\u002Flabel>\n    <input value=\"{{ joinName }}\" sc-camel-on-change=\"{{ onJoinName }}\" placeholder=\"Gentleman\" sc-camel-auto-capitalize=\"words\" sc-camel-auto-correct=\"off\" sc-camel-auto-complete=\"name\" sc-camel-enter-key-hint=\"go\" style=\"font-size:21px;padding:15px;border-radius:var(--radius-md);border:1px solid #2b3d59;background:var(--color-surface);color:var(--color-text)\">\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ submitJoin }}\" style=\"cursor:pointer;min-height:64px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:transparent;color:var(--color-accent-200);font-family:var(--font-heading);font-size:26px;font-weight:800;transition:transform .08s ease\" style-active=\"transform:scale(.985)\" style-hover=\"background:color-mix(in srgb,var(--color-accent) 16%,transparent)\">Join room<\u002Fbutton>\n  <div style=\"font-size:13px;min-height:20px;color:{{ joinNoteColor }}\">{{ joinNote }}<\u002Fdiv>\n  <button sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;background:none;border:none;color:color-mix(in srgb,var(--color-text) 45%,transparent);font-size:13px;text-decoration:underline;text-underline-offset:3px\">Back<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPlayer }}\">\n<div style=\"height:var(--app-h);overflow:hidden;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:12px;box-sizing:border-box\">\n  <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n    <div style=\"min-width:0;display:flex;align-items:baseline;gap:8px\">\n      <span style=\"min-width:0;font-family:var(--font-heading);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ myName }}<\u002Fspan>\n      <span style=\"flex:none;font-size:12px;white-space:nowrap;color:color-mix(in srgb,var(--color-text) 42%,transparent)\">room {{ code }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:none;display:flex;align-items:baseline;gap:6px\">\n      <span style=\"font-family:var(--font-heading);font-size:31px;font-weight:800;color:var(--color-accent-300);font-variant-numeric:tabular-nums\">{{ myScore }}<\u002Fspan>\n      <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 42%,transparent)\">pts<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ pWaiting }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center\">\n      <div style=\"width:10px;height:10px;border-radius:50%;background:var(--color-accent);animation:lofgPulse 1.4s ease-in-out infinite\"><\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:35px;font-weight:800;letter-spacing:.005em\">{{ pWaitTitle }}<\u002Fdiv>\n      <div style=\"font-size:14px;max-width:30ch;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ pWaitBody }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ pQuestion }}\">\n    <div style=\"display:flex;flex-direction:column;gap:11px;flex:1;min-height:0\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n        <span style=\"white-space:nowrap;font:italic 700 14px/1 var(--font-heading);letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid {{ tierFg }};color:{{ tierFg }}\">{{ tierLabel }} · {{ tierPoints }}pt<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-size:35px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;padding:4px 12px;border-radius:var(--radius-sm);background:var(--color-bg);border:1px solid {{ clockBorder }};color:{{ clockColor }};text-shadow:0 0 14px {{ clockGlow }};animation:{{ clockAnim }}\">{{ clock }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:26px;border-radius:var(--radius-sm);overflow:hidden;background:linear-gradient(180deg,var(--color-surface),var(--color-bg));border:1px solid var(--color-line)\">\n        <div style=\"position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),color-mix(in srgb, var(--color-text) 12%, transparent) calc(10% - 1px),color-mix(in srgb, var(--color-text) 12%, transparent) 10%)\"><\u002Fdiv>\n        <div style=\"position:absolute;top:0;bottom:0;left:0;width:{{ clockPct }}%;background:linear-gradient(90deg,color-mix(in srgb,var(--color-accent) 8%,transparent),color-mix(in srgb,var(--color-accent) 28%,transparent));transition:width .9s linear\"><\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 48 30\" width=\"30\" height=\"19\" style=\"position:absolute;top:50%;left:{{ runnerLeft }};transform:translate(-50%,-50%);transition:left .9s linear;animation:lofgBob .42s ease-in-out infinite\">\n          <ellipse cx=\"24\" cy=\"15\" rx=\"22\" ry=\"13\" fill=\"#6b3a1f\" stroke=\"var(--color-accent-100)\" stroke-width=\"2.5\"><\u002Fellipse>\n          <path d=\"M7 15h8M33 15h8M18 15h12M20 10.5v9M24 10.5v9M28 10.5v9\" stroke=\"var(--color-accent-100)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex:none;font-family:var(--font-heading);font-size:clamp(24px,5.6vw,33px);font-weight:700;line-height:1.1;letter-spacing:.005em;text-wrap:pretty;margin:2px 0\">{{ qText }}<\u002Fdiv>\n      <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(62px,1fr);gap:9px\">\n        <sc-for list=\"{{ pOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ o.onTap }}\" style=\"cursor:pointer;width:100%;min-height:64px;display:flex;align-items:center;gap:13px;text-align:left;padding:10px 14px;border-radius:var(--radius-md);border:1px solid {{ o.border }};border-left:4px solid {{ o.rail }};background:{{ o.bg }};color:{{ o.fg }};transition:transform .08s ease,background .12s ease;-webkit-user-select:none;user-select:none\" style-active=\"transform:scale(.975)\">\n            <span style=\"flex:none;width:38px;height:38px;border-radius:var(--radius-sm);display:grid;place-items:center;background:{{ o.badgeBg }};color:{{ o.badgeFg }};font:800 22px var(--font-heading);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-text) 14%, transparent)\">{{ o.letter }}<\u002Fspan>\n            <span style=\"font-family:var(--font-heading);font-size:clamp(19px,5vw,24px);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.1\">{{ o.text }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:none;font-size:13px;text-align:center;min-height:18px;color:{{ pStatusColor }}\">{{ pStatus }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ pResults }}\">\n    <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center\">\n      <div style=\"flex:none;text-align:center;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-size:clamp(44px,10vw,60px);font-weight:800;letter-spacing:.005em;color:{{ pVerdictColor }};animation:lofgSlam .4s ease-out\">{{ pVerdict }}<\u002Fdiv>\n        <div style=\"font-size:14px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Answer: <span style=\"color:var(--color-accent-300);font-weight:600\">{{ correctText }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 45%,transparent)\">{{ pTimeNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scr
